name: macOS app
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain information
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version
      - name: Tests
        run: swift test --parallel
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-model.txt
      - name: Install build-only conversion dependencies
        run: python -m pip install -r scripts/requirements-model.txt
      - name: Convert and validate model
        run: python scripts/convert_model.py
      - name: End-to-end Core ML image test
        run: |
          xcrun coremlcompiler compile build/models/Anime4x.mlpackage build/models
          DEFUPSCALER_TEST_MODEL="$PWD/build/models/Anime4x.mlmodelc" swift test --filter EngineIntegrationTests
      - name: Package application
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DefUpscaler-macOS-AppleSilicon
          path: |
            build/DefUpscaler-macOS-AppleSilicon.zip
            build/SHA256SUMS.txt
            build/models/model-provenance.json
          if-no-files-found: error
          retention-days: 14
